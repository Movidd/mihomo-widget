# mihomo-widget UI config (keep next to mihomo-widget.exe, UTF-8)
# Remove the '#' in front of a key to enable it; defaults shown.
# 控件启动时读取本文件；修改后重启控件生效。

# ---------------------------------------------------------------
# 手动配置（用户可编辑）
# ---------------------------------------------------------------

# panel font face and logical size (scaled by DPI automatically)
#font_face = Microsoft YaHei UI
#font_size = 15

# window opacity (40..255, 255 = fully opaque)
alpha = 200

# collapsed / hover window size in logical px (auto-scaled with DPI and font size)
#width = 220
#width_hover = 220
#height = 26
#height_hover = 76

# speed row top offset from the panel top edge (logical px), used in both the
# collapsed and the hovered state (there is no separate hover offset).
speed_top = 3

# speed refresh interval (ms, 100..3000); also the rate-normalization base.
#speed_refresh_ms = 1000

# speed units: 1 = auto (pick KB/MB/GB by magnitude); 0 = fixed 'MB/s'.
#speed_unit_auto = 1

# topmost watchdog: the panel is created WS_EX_TOPMOST, but Windows can drop it
# out of the topmost band after a workstation unlock, a resolution/monitor
# change or a DWM z-order rebuild — then an ordinary window covers it until you
# click the panel. The guard re-asserts topmost (without stealing focus) and
# logs the event. Value = sweep interval in ms (1000..60000); 0 = disabled.
#topmost_guard_ms = 5000

# fullscreen auto-hide: when the foreground app is fullscreen (a game or a
# presentation), the widget hides itself and pauses all redraw/guard activity —
# a persistent layered topmost window can disturb the DWM composition path and
# cause stutter in fullscreen games. Restores silently (no focus steal) when
# fullscreen ends. 1 = enabled (default), 0 = disabled.
#autohide_fullscreen = 1

# colors (#RRGGBB)
#color_bg = #14161c
#color_speed = #cbf7cc
#color_text = #dddddd
#color_dim = #888888
#color_warn = #ffb454

# ---------------------------------------------------------------
# 自动管理（widget 运行时读写，请勿手改）
# ---------------------------------------------------------------

# window position (physical px) — rewritten by the widget on exit so the panel
# reopens where you left it. No need to edit these by hand.
#window_x = 350
#window_y = 350

# runtime state persisted by the widget (the system-proxy switch / the Network
# Interface submenu). The widget rewrites these each time they change; manual
# edits have no lasting effect.
#
# sysproxy is 0|1; nic_ifindex is the selected NIC index (0 = auto).
#
# NOTE: there is deliberately **no TUN key** here. Whether the core runs with
# TUN is decided by ONE place only - `tun.enable` in your config.yaml, which the
# core reads while starting up (creating the NIC that early is what keeps a
# freshly dialed hysteria2/QUIC socket from being bound to the TUN's own address
# and self-looping for ~a minute). The menu's "TUN Mode" item is a runtime
# PATCH: it applies to the current run and is not remembered, so keep editing
# config.yaml if you want to change the startup state. A TUN switch made while
# the core is running is watched over by the self-heal (QUIC reset).
#sysproxy = 0
#nic_ifindex = 0
